<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>청소년부 겨울캠프 - 경찰과 도둑</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
        .title-font { font-family: 'Black Han Sans', sans-serif; }
        .prison-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
        .player-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; user-select: none; }
        .player-card:active { transform: scale(0.92); }
        .status-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .announcement-bar { animation: slideDown 0.5s ease-out; }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        
        /* 채팅창 애니메이션 */
        #chat-modal { transition: transform 0.3s ease-in-out; }
        .chat-hidden { transform: translateY(100%); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen">

    <!-- 로그인 화면 -->
    <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen p-6">
        <div class="mb-10 text-center">
            <h1 class="text-5xl title-font mb-2 text-yellow-400 drop-shadow-lg">경찰과 도둑</h1>
            <p class="text-slate-400 tracking-widest text-sm uppercase">Winter Youth Camp 2026</p>
        </div>
        <div class="bg-slate-900 p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-800">
            <div class="mb-6">
                <label class="block text-xs font-bold text-slate-500 mb-2 ml-1 uppercase">Name</label>
                <input id="user-name" type="text" placeholder="본인의 이름을 입력하세요" 
                    class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-yellow-500 text-white transition-all">
            </div>
            
            <p class="text-xs font-bold text-slate-500 mb-3 ml-1 uppercase">Role Selection</p>
            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="joinGame('police')" class="group flex flex-col items-center justify-center bg-blue-600/10 hover:bg-blue-600 border-2 border-blue-600/30 hover:border-blue-600 p-6 rounded-2xl transition-all">
                    <span class="text-3xl mb-2">👮</span>
                    <span class="font-bold text-blue-400 group-hover:text-white">경찰 참여</span>
                </button>
                <button onclick="joinGame('thief')" class="group flex flex-col items-center justify-center bg-red-600/10 hover:bg-red-600 border-2 border-red-600/30 hover:border-red-600 p-6 rounded-2xl transition-all">
                    <span class="text-3xl mb-2">🥷</span>
                    <span class="font-bold text-red-400 group-hover:text-white">도둑 참여</span>
                </button>
            </div>
            
            <p id="error-msg" class="text-red-400 text-sm mb-4 text-center hidden font-bold"></p>
            
            <button onclick="loginAsAdmin()" class="w-full py-3 text-slate-500 text-xs font-bold hover:text-yellow-500 transition-colors uppercase tracking-widest border-t border-slate-800 mt-2 pt-4">
                Admin Authentication
            </button>
        </div>
    </div>

    <!-- 메인 대시보드 -->
    <div id="game-screen" class="hidden min-h-screen flex flex-col">
        <!-- 긴급 공지 바 -->
        <div id="announcement-display" class="hidden announcement-bar bg-yellow-500 text-black px-6 py-3 font-bold text-center shadow-lg z-50 sticky top-0">
            <span class="mr-2">📢</span> <span id="announcement-text"></span>
            <button onclick="clearAnnouncementLocally()" class="ml-4 text-[10px] bg-black/10 px-2 py-1 rounded font-black uppercase">Close</button>
        </div>

        <!-- 상단 헤더 -->
        <header id="role-header" class="sticky top-0 z-10 bg-slate-950/80 backdrop-blur-md px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="flex items-center gap-3">
                <div id="sync-status" class="w-2.5 h-2.5 rounded-full bg-green-500 status-pulse"></div>
                <div>
                    <h2 id="my-info" class="text-lg font-bold leading-tight"></h2>
                    <span id="role-tag" class="text-[10px] font-black uppercase tracking-tighter opacity-70"></span>
                </div>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[9px] font-black text-slate-500 uppercase">Remaining</span>
                <div id="timer" class="text-2xl font-mono font-black text-white leading-none">00:00</div>
            </div>
        </header>

        <!-- 내용 영역 -->
        <main class="flex-1 p-5 overflow-y-auto no-scrollbar">
            <!-- 체포 상태 알림창 (도둑 전용) -->
            <div id="caught-alert" class="hidden mb-6 bg-red-600 p-5 rounded-2xl shadow-lg shadow-red-900/40 border-2 border-red-400 flex items-center gap-4">
                <span class="text-4xl animate-bounce">⛓️</span>
                <div>
                    <h3 class="font-black text-xl leading-tight text-white">당신은 체포되었습니다!</h3>
                    <p class="text-red-100 text-sm">아동부실(감옥)로 이동하세요.</p>
                </div>
            </div>

            <!-- 현황 통계 -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col items-center shadow-inner">
                    <span class="text-[10px] font-bold text-slate-500 uppercase mb-1 tracking-widest">Active Thieves</span>
                    <span id="active-thieves" class="text-3xl font-black text-white">0</span>
                </div>
                <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col items-center shadow-inner">
                    <span class="text-[10px] font-bold text-slate-500 uppercase mb-1 tracking-widest">In Prison</span>
                    <span id="caught-thieves" class="text-3xl font-black text-slate-500">0</span>
                </div>
            </div>

            <!-- 경찰 명단 -->
            <section id="police-section" class="mb-8">
                <h3 class="text-xs font-black text-slate-500 uppercase mb-3 flex items-center gap-2">
                    <span class="w-1 h-3 bg-blue-600 rounded-full"></span> Police Units
                </h3>
                <div id="police-list" class="flex flex-wrap gap-2"></div>
            </section>

            <!-- 도둑 목록 -->
            <section id="alive-section" class="mb-8">
                <h3 class="text-xs font-black text-slate-500 uppercase mb-3 flex items-center gap-2">
                    <span class="w-1 h-3 bg-green-500 rounded-full"></span> Active Targets
                </h3>
                <div id="alive-list" class="prison-grid"></div>
            </section>

            <!-- 감옥 목록 -->
            <section id="prison-section" class="mb-24">
                <h3 class="text-xs font-black text-slate-500 uppercase mb-3 flex items-center gap-2">
                    <span class="w-1 h-3 bg-red-600 rounded-full"></span> Prison (Needs Rescue)
                </h3>
                <div id="prison-list" class="prison-grid"></div>
            </section>
        </main>

        <!-- 도둑 전용 채팅 버튼 (플로팅) -->
        <button id="chat-toggle-btn" onclick="toggleChat()" class="hidden fixed bottom-24 right-6 w-14 h-14 bg-red-600 rounded-full shadow-2xl flex items-center justify-center text-2xl z-40 border-2 border-red-400">
            💬
        </button>

        <!-- 도둑 전용 채팅 모달 -->
        <div id="chat-modal" class="fixed inset-x-0 bottom-0 h-3/4 bg-slate-900 z-50 rounded-t-3xl border-t-2 border-red-500 shadow-2xl flex flex-col chat-hidden transition-all duration-300">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-800 rounded-t-3xl">
                <h3 class="font-black text-red-500 flex items-center gap-2">
                    <span class="text-xl">🥷</span> 도둑 비밀 채팅방
                </h3>
                <button onclick="toggleChat()" class="text-slate-400 text-xs font-bold uppercase tracking-widest">Hide</button>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar">
                <!-- 메시지 출력 -->
            </div>
            <div class="p-4 bg-slate-950 border-t border-slate-800 flex gap-2">
                <input id="chat-input" type="text" placeholder="메시지를 입력하세요..." 
                    class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-red-500">
                <button onclick="sendChatMessage()" class="bg-red-600 text-white font-black px-4 py-3 rounded-xl uppercase text-xs">Send</button>
            </div>
        </div>

        <!-- 하단 컨트롤 패널 -->
        <footer class="fixed bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-slate-950 via-slate-950 to-transparent z-30">
            <div id="admin-controls" class="hidden mb-4 bg-slate-900 p-4 rounded-2xl border-2 border-yellow-600/30 shadow-2xl">
                <!-- 긴급 공지 발송 -->
                <div class="mb-4 bg-slate-800 p-3 rounded-xl border border-slate-700">
                    <p class="text-[9px] font-black text-yellow-500 uppercase mb-2 tracking-widest">Broadcast Message</p>
                    <div class="flex gap-2">
                        <input id="announcement-input" type="text" placeholder="공지 메시지 입력" 
                            class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none">
                        <button onclick="sendAnnouncement()" class="bg-yellow-600 text-black font-black text-[10px] px-3 py-2 rounded-lg uppercase">Send</button>
                    </div>
                </div>

                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2 bg-slate-800 px-3 py-2 rounded-xl">
                        <label class="text-[10px] font-black text-slate-400 uppercase">Min</label>
                        <input id="timer-input" type="number" value="15" min="1" max="60" 
                            class="bg-transparent w-8 text-center font-black text-yellow-500 focus:outline-none">
                    </div>
                    <button onclick="toggleGame()" id="game-toggle-btn" 
                        class="bg-yellow-600 hover:bg-yellow-500 px-8 py-3 rounded-xl font-black text-sm uppercase shadow-lg shadow-yellow-900/20 active:scale-95 transition-all">
                        Game Start
                    </button>
                </div>
                <button onclick="resetGame()" class="w-full py-2 text-[10px] font-bold text-red-400/50 hover:text-red-400 uppercase tracking-widest transition-all">
                    Reset Session
                </button>
            </div>
            
            <button onclick="logout()" class="w-full py-3 bg-slate-900 border border-slate-800 rounded-xl text-[10px] font-black text-slate-500 uppercase tracking-widest hover:bg-slate-800 transition-all">
                Exit Session
            </button>
        </footer>
    </div>

    <script>
        // --- Supabase 설정 (본인 정보로 교체 필수) ---
        const SUPABASE_URL = "https://ebndrppiaxgggsaglzwo.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVibmRycHBpYXhnZ2dzYWdsendvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxOTA1MjIsImV4cCI6MjA4NTc2NjUyMn0.ZYeyCNanoqV14OyUFrtJ_bZV47H34xS9N1CVhdrmsvY";
        const ADMIN_PASSWORD = "0615";

        let _supabase;
        if (SUPABASE_URL && SUPABASE_ANON_KEY) {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        let myProfile = null;
        let players = [];
        let gameState = { is_active: false, start_time: null, duration_minutes: 15, announcement: '' };
        let timerInterval = null;
        let pollingInterval = null;
        let isAdmin = false;
        let lastAnnouncementShown = '';
        let chatOpen = false;

        window.onload = async () => {
            const savedProfile = localStorage.getItem('camp_player_profile');
            isAdmin = localStorage.getItem('camp_is_admin') === 'true';

            if (savedProfile) {
                myProfile = JSON.parse(savedProfile);
                if (!isAdmin) {
                    const { data } = await _supabase.from('players').select('*').eq('id', myProfile.id).maybeSingle();
                    if (data) enterGameScreen(data);
                    else localStorage.clear();
                } else {
                    enterGameScreen(myProfile);
                }
            }
            await refreshData();
            subscribeToChanges();
            startPolling();
        };

        async function refreshData() {
            await Promise.all([fetchGameState(), fetchPlayers(), fetchChatMessages()]);
        }

        function startPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(refreshData, 3000); 
        }

        function loginAsAdmin() {
            const pw = prompt("관리자 암호를 입력하세요.");
            if (pw === ADMIN_PASSWORD) {
                isAdmin = true;
                localStorage.setItem('camp_is_admin', 'true');
                myProfile = { id: 'admin-session', name: "ADMIN(SYS)", role: "admin" };
                localStorage.setItem('camp_player_profile', JSON.stringify(myProfile));
                enterGameScreen(myProfile);
            }
        }

        async function joinGame(role) {
            const name = document.getElementById('user-name').value.trim();
            if (!name) return alert("이름을 입력하세요!");
            
            try {
                const { data: existing } = await _supabase.from('players').select('name').eq('name', name).maybeSingle();
                if (existing) return alert("이미 등록된 이름입니다.");

                const { data, error } = await _supabase.from('players').insert([{ name, role, is_caught: false }]).select();
                if (error) throw error;
                
                isAdmin = false;
                localStorage.setItem('camp_is_admin', 'false');
                myProfile = data[0];
                localStorage.setItem('camp_player_profile', JSON.stringify(myProfile));
                enterGameScreen(myProfile);
            } catch (err) { alert(err.message); }
        }

        function enterGameScreen(profile) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('my-info').innerText = profile.name;
            
            const header = document.getElementById('role-header');
            const roleTag = document.getElementById('role-tag');
            const chatBtn = document.getElementById('chat-toggle-btn');
            
            if (isAdmin) {
                header.className = "sticky top-0 z-10 bg-slate-950/80 backdrop-blur-md px-6 py-4 flex justify-between items-center border-b-2 border-yellow-500";
                roleTag.innerText = '🛡️ SYSTEM ADMIN';
                roleTag.className = 'text-[10px] font-black uppercase tracking-tighter text-yellow-500';
                document.getElementById('admin-controls').classList.remove('hidden');
                chatBtn.classList.remove('hidden'); // 관리자도 채팅 가능
            } else if (profile.role === 'police') {
                header.className = "sticky top-0 z-10 bg-slate-950/80 backdrop-blur-md px-6 py-4 flex justify-between items-center border-b-2 border-blue-600";
                roleTag.innerText = '👮 POLICE UNIT';
                roleTag.className = 'text-[10px] font-black uppercase tracking-tighter text-blue-500';
                chatBtn.classList.add('hidden'); // 경찰은 채팅 불가
            } else {
                header.className = "sticky top-0 z-10 bg-slate-950/80 backdrop-blur-md px-6 py-4 flex justify-between items-center border-b-2 border-red-600";
                roleTag.innerText = '🥷 THIEF SURVIVOR';
                roleTag.className = 'text-[10px] font-black uppercase tracking-tighter text-red-500';
                chatBtn.classList.remove('hidden'); // 도둑은 채팅 가능
            }
            refreshData();
        }

        async function fetchPlayers() {
            const { data } = await _supabase.from('players').select('*').order('created_at', { ascending: true });
            players = data || [];
            
            if (myProfile && !isAdmin && myProfile.role === 'thief') {
                const me = players.find(p => p.id === myProfile.id);
                if (me && me.is_caught) {
                    document.getElementById('caught-alert').classList.remove('hidden');
                } else {
                    document.getElementById('caught-alert').classList.add('hidden');
                }
            }
            renderPlayers();
            updateStats();
        }

        async function fetchGameState() {
            const { data } = await _supabase.from('game_state').select('*').eq('id', 1).maybeSingle();
            if (data) {
                gameState = data;
                updateAnnouncementUI(gameState.announcement);

                const timerInput = document.getElementById('timer-input');
                if (isAdmin && !gameState.is_active && document.activeElement !== timerInput) {
                    timerInput.value = gameState.duration_minutes || 15;
                }
                updateUIByGameState();
            }
        }

        function updateAnnouncementUI(text) {
            const bar = document.getElementById('announcement-display');
            const txt = document.getElementById('announcement-text');
            if (text && text.trim() !== '') {
                if (text !== lastAnnouncementShown) {
                    bar.classList.remove('hidden');
                    txt.innerText = text;
                    lastAnnouncementShown = text;
                }
            } else {
                bar.classList.add('hidden');
                lastAnnouncementShown = '';
            }
        }

        function clearAnnouncementLocally() {
            document.getElementById('announcement-display').classList.add('hidden');
        }

        async function sendAnnouncement() {
            const input = document.getElementById('announcement-input');
            const message = input.value.trim();
            const { error } = await _supabase.from('game_state').update({ announcement: message }).eq('id', 1);
            if (error) alert("발송 실패: " + error.message);
            else input.value = '';
        }

        // --- 채팅 기능 ---
        function toggleChat() {
            chatOpen = !chatOpen;
            const modal = document.getElementById('chat-modal');
            if (chatOpen) {
                modal.classList.remove('chat-hidden');
                scrollToBottom();
            } else {
                modal.classList.add('chat-hidden');
            }
        }

        async function fetchChatMessages() {
            const { data } = await _supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(50);
            
            if (data) renderMessages(data);
        }

        function renderMessages(messages) {
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = '';
            messages.forEach(msg => {
                const isMe = myProfile && msg.player_name === myProfile.name;
                const div = document.createElement('div');
                div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                
                div.innerHTML = `
                    <span class="text-[9px] font-bold text-slate-500 mb-1 ml-1 mr-1">${msg.player_name}</span>
                    <div class="${isMe ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-200'} px-3 py-2 rounded-2xl text-xs max-w-[80%] shadow-sm">
                        ${msg.content}
                    </div>
                `;
                chatBox.appendChild(div);
            });
            if (chatOpen) scrollToBottom();
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const content = input.value.trim();
            if (!content) return;

            const { error } = await _supabase.from('messages').insert([{
                player_name: myProfile.name,
                content: content,
                role: myProfile.role
            }]);

            if (error) console.error("Message send fail:", error);
            else input.value = '';
        }

        function scrollToBottom() {
            const chatBox = document.getElementById('chat-messages');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function subscribeToChanges() {
            _supabase.channel('game_events')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, () => fetchPlayers())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'game_state' }, (payload) => {
                    gameState = payload.new;
                    updateAnnouncementUI(gameState.announcement);
                    updateUIByGameState();
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => fetchChatMessages())
                .subscribe();
        }

        async function handleAction(targetPlayer) {
            if (!gameState.is_active) return;
            if (!myProfile) return;

            const canCatch = (myProfile.role === 'police' || isAdmin);
            const canRescue = (myProfile.role === 'thief' || isAdmin);

            if (canCatch && targetPlayer.role === 'thief' && !targetPlayer.is_caught) {
                await _supabase.from('players').update({ is_caught: true, caught_at: new Date().toISOString() }).eq('id', targetPlayer.id);
            } else if (canRescue && targetPlayer.role === 'thief' && targetPlayer.is_caught) {
                if (!isAdmin && myProfile.role === 'thief') {
                    const me = players.find(p => p.id === myProfile.id);
                    if (me && me.is_caught) return alert("당신은 이미 잡혔습니다!");
                }
                await _supabase.from('players').update({ is_caught: false }).eq('id', targetPlayer.id);
            }
            await fetchPlayers();
        }

        function renderPlayers() {
            const aliveList = document.getElementById('alive-list');
            const prisonList = document.getElementById('prison-list');
            const policeList = document.getElementById('police-list');
            
            aliveList.innerHTML = '';
            prisonList.innerHTML = '';
            policeList.innerHTML = '';

            players.forEach(p => {
                if (p.role === 'police') {
                    const badge = document.createElement('span');
                    badge.className = 'bg-blue-600/20 text-blue-400 border border-blue-600/30 text-[10px] px-3 py-1 rounded-full font-black';
                    badge.innerText = p.name;
                    policeList.appendChild(badge);
                    return;
                }

                const card = document.createElement('div');
                let cardClass = "player-card p-4 rounded-2xl text-center font-black text-sm shadow-xl border-2 ";
                if (p.is_caught) {
                    cardClass += "bg-slate-900 text-slate-600 border-slate-800";
                    if (isAdmin || (myProfile && myProfile.role === 'thief')) cardClass += " border-red-600/40 text-red-500/50 animate-pulse";
                } else {
                    cardClass += "bg-slate-800 text-white border-slate-700";
                    if (isAdmin || (myProfile && myProfile.role === 'police')) cardClass += " border-blue-500 text-white shadow-blue-900/20";
                }
                card.className = cardClass;
                card.innerText = p.name;
                card.onclick = () => handleAction(p);
                if (p.is_caught) prisonList.appendChild(card);
                else aliveList.appendChild(card);
            });
            if (policeList.innerHTML === '') policeList.innerHTML = '<p class="text-[10px] text-slate-600 italic">No on-duty police.</p>';
        }

        function updateStats() {
            const thieves = players.filter(p => p.role === 'thief');
            const caughtCount = thieves.filter(p => p.is_caught).length;
            document.getElementById('active-thieves').innerText = thieves.length - caughtCount;
            document.getElementById('caught-thieves').innerText = caughtCount;
        }

        async function toggleGame() {
            const newStatus = !gameState.is_active;
            const duration = parseInt(document.getElementById('timer-input').value) || 15;
            const startTime = newStatus ? new Date().toISOString() : gameState.start_time;
            await _supabase.from('game_state').upsert({ id: 1, is_active: newStatus, start_time: startTime, duration_minutes: duration, announcement: gameState.announcement });
            await fetchGameState();
        }

        function updateUIByGameState() {
            const btn = document.getElementById('game-toggle-btn');
            const timerEl = document.getElementById('timer');
            if (gameState && gameState.is_active) {
                btn.innerText = "Stop Operation";
                btn.className = "bg-red-600 hover:bg-red-500 px-8 py-3 rounded-xl font-black text-sm uppercase shadow-lg shadow-red-900/20 active:scale-95 transition-all";
                timerEl.classList.add('text-red-500');
                startTimer();
            } else {
                btn.innerText = "Start Operation";
                btn.className = "bg-yellow-600 hover:bg-yellow-500 px-8 py-3 rounded-xl font-black text-sm uppercase shadow-lg shadow-yellow-900/20 active:scale-95 transition-all";
                timerEl.classList.remove('text-red-500');
                timerEl.innerText = String(gameState.duration_minutes || 15).padStart(2, '0') + ":00";
                clearInterval(timerInterval);
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            if (!gameState || !gameState.start_time) return;
            const durationMs = (gameState.duration_minutes || 15) * 60 * 1000;
            const startTime = new Date(gameState.start_time).getTime();
            timerInterval = setInterval(() => {
                const now = Date.now();
                const elapsed = now - startTime;
                const remaining = durationMs - elapsed;
                if (remaining <= 0) {
                    document.getElementById('timer').innerText = "00:00";
                    clearInterval(timerInterval);
                    if (isAdmin && gameState.is_active) {
                        alert("Time limit reached!");
                        toggleGame();
                    }
                    return;
                }
                const min = String(Math.floor(remaining / 60000)).padStart(2, '0');
                const sec = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
                document.getElementById('timer').innerText = `${min}:${sec}`;
                if (remaining < 60000) document.getElementById('timer').classList.add('status-pulse');
                else document.getElementById('timer').classList.remove('status-pulse');
            }, 1000);
        }

        function logout() {
            if(!confirm("로그아웃 하시겠습니까?")) return;
            localStorage.clear();
            location.reload();
        }

        async function resetGame() {
            if(!confirm("정말로 모든 데이터를 초기화하시겠습니까?")) return;
            await _supabase.from('players').delete().neq('name', '_system_');
            await _supabase.from('game_state').upsert({ id: 1, is_active: false, start_time: null, duration_minutes: 15, announcement: '' });
            await _supabase.from('messages').delete().neq('player_name', '_system_'); // 채팅 내역도 초기화
            location.reload();
        }
    </script>
</body>
</html>
